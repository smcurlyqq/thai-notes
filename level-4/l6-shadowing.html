<script type="application/json" id="practice-data">[{"zh": "摩羯座（1 月 14 日至 2 月 12 日）：有野心、意志堅定，但有時對人生過於認真，因此總是為生活焦慮。", "ja": "山羊座（1月14日～2月12日）：野心があり意志も強いが、人生に真剣になりすぎて、いつも不安を抱えることがある。", "phrases": [{"th": "ราศีมังกร", "date": "14 ม.ค. - 12 ก.พ.", "start": 8.8, "end": 16.08}, {"th": "เป็นคนทะเยอทะยาน มุ่งมั่น", "start": 16.08, "end": 19.56}, {"th": "แต่บางครั้งเอาจริงเอาจังกับชีวิตมากไป", "start": 20.02, "end": 24.32}, {"th": "จนทำให้วิตกกังวลกับชีวิตเสมอ", "start": 24.8, "end": 28.5}]}, {"zh": "水瓶座（2 月 13 日至 3 月 13 日）：有禮貌、富有慈悲心，表面上朋友很多，但真正能信任的親近朋友其實只有幾個。", "ja": "水瓶座（2月13日～3月13日）：礼儀正しく思いやりがある。外からは友人が多く見えるが、本当に信頼できる親友は数人しかいない。", "phrases": [{"th": "ราศีกุมภ์", "date": "13 ก.พ. – 13 มี.ค.", "start": 30.06, "end": 37.72}, {"th": "เป็นคนสุภาพและมีเมตตา", "start": 37.72, "end": 40.76}, {"th": "ภายนอกดูเหมือนเป็นคนมีเพื่อนมาก", "start": 41.24, "end": 44.58}, {"th": "แต่จริง ๆ กลับมีเพื่อนสนิทที่ไว้วางใจได้ไม่กี่คน", "start": 45.06, "end": 50.58}]}, {"zh": "雙魚座（3 月 14 日至 4 月 12 日）：情感敏銳、很能同理他人；缺點是有時過於理想化，以致不敢面對現實。", "ja": "魚座（3月14日～4月12日）：感受やすく、他人への共感力が高い。一方、理想主義が過ぎて現実に向き合えないことがある。", "phrases": [{"th": "ราศีมีน", "date": "14 มี.ค. - 12 เม.ย.", "start": 52.62, "end": 60.6}, {"th": "เป็นคนอารมณ์อ่อนไหว", "start": 60.6, "end": 62.4}, {"th": "ช่างเห็นอกเห็นใจผู้อื่น", "start": 63.26, "end": 65.72}, {"th": "แต่ข้อเสียคือ", "start": 66.28, "end": 67.94}, {"th": "บางครั้งเป็นคนโลกสวยมากเกินไป", "start": 68.26, "end": 71.64}, {"th": "จนทำให้ไม่กล้าเผชิญหน้ากับความจริง", "start": 72.32, "end": 75.98}]}, {"zh": "牡羊座（4 月 13 日至 5 月 13 日）：熱情、靈活又充滿活力；然而也可能自負傲慢，因此不太喜歡聽取別人的意見。", "ja": "牡羊座（4月13日～5月13日）：熱意があり機敏で活動的。ただし自信過剰で高慢なところがあり、他人の意見をあまり聞きたがらない。", "phrases": [{"th": "ราศีเมษ", "date": "13 เม.ย. - 13 พ.ค.", "start": 77.46, "end": 84.36}, {"th": "เป็นคนกระตือรือร้นคล่องแคล่ว กระฉับกระเฉง", "start": 84.36, "end": 89.48}, {"th": "อย่างไรก็ตาม", "start": 89.98, "end": 91.4}, {"th": "คนราศีเมษเป็นคนอวดดี หยิ่ง", "start": 91.86, "end": 96.12}, {"th": "จึงไม่ค่อยชอบฟังความเห็นของผู้อื่น", "start": 96.4, "end": 99.86}]}, {"zh": "金牛座（5 月 14 日至 6 月 13 日）：沉默寡言，卻有耐心又堅強；說話直率、不虛偽。", "ja": "牡牛座（5月14日～6月13日）：物静かだが、忍耐強くたくましい。率直に話し、取り繕わない。", "phrases": [{"th": "ราศีพฤษภ", "date": "14 พ.ค. - 13 มิ.ย.", "start": 101.66, "end": 109.76}, {"th": "เป็นคนเงียบขรึม แต่อดทน", "start": 109.76, "end": 112.66}, {"th": "แข็งแกร่ง", "start": 113.3, "end": 114.12}, {"th": "เป็นคนพูดจาตรงไปตรงมา ไม่เสแสร้ง", "start": 114.6, "end": 119.1}]}, {"zh": "雙子座（6 月 14 日至 7 月 14 日）：內心充滿矛盾；有時熱愛玩樂和幽默，有時喜歡獨處，有時又很容易寂寞。", "ja": "双子座（6月14日～7月14日）：内面に矛盾を抱えている。楽しいことや冗談が好きなときもあれば、一人を好むときもあり、寂しがりになることもある。", "phrases": [{"th": "ราศีเมถุน", "date": "14 มิ.ย. - 14 ก.ค.", "start": 121.66, "end": 129.46}, {"th": "เป็นคนที่มีความขัดแย้งในตัวเอง", "start": 129.46, "end": 132.9}, {"th": "บางครั้งก็รักความสนุกสนาน", "start": 133.38, "end": 136.38}, {"th": "ชอบความตลกขบขัน", "start": 136.9, "end": 139.05}, {"th": "แต่บางครั้งก็ขี้เหงาง่าย", "start": 139.55, "end": 142.55}]}, {"zh": "巨蟹座（7 月 15 日至 8 月 16 日）：知道自己脆弱、容易敏感，因此常塑造出堅強的外表，有時甚至顯得具攻擊性，以保護自己。", "ja": "蟹座（7月15日～8月16日）：自分が弱く傷つきやすいと分かっているため、外見上は強く見せようとし、自分を守るために攻撃的に見えることもある。", "phrases": [{"th": "ราศีกรกฎ", "date": "15 ก.ค. - 16 ส.ค.", "start": 143.52, "end": 151.44}, {"th": "เป็นคนที่รู้ตัวว่าเป็นคนอ่อนแอ", "start": 151.44, "end": 154.62}, {"th": "อ่อนไหวง่าย", "start": 155.2, "end": 156.48}, {"th": "จึงมักสร้างบุคลิกภายนอก", "start": 157.06, "end": 159.56}, {"th": "ให้ดูแข็งแกร่ง", "start": 160.0, "end": 161.38}, {"th": "จนบางครั้งดูก้าวร้าวเพื่อปกป้องตัวเอง", "start": 162.04, "end": 166.22}]}, {"zh": "獅子座（8 月 17 日至 9 月 16 日）：心胸寬大、慷慨大方；然而性格固執，因此喜歡當領導，也常對別人指手畫腳。", "ja": "獅子座（8月17日～9月16日）：寛大で気前がよい。一方で頑固なため、リーダーになることや、人にあれこれ指図することを好む。", "phrases": [{"th": "ราศีสิงห์", "date": "17 ส.ค. - 16 ก.ย.", "start": 168.16, "end": 175.6}, {"th": "คนราศีสิงห์เป็นคนใจกว้าง", "start": 175.6, "end": 178.84}, {"th": "มีนิสัยเอื้อเฟื้อเผื่อแผ่", "start": 179.36, "end": 182.23}, {"th": "อย่างไรก็ตาม", "start": 182.56, "end": 183.94}, {"th": "ชาวราศีสิงห์เป็นคนดื้อรั้น", "start": 184.52, "end": 187.86}, {"th": "จึงชอบเป็นผู้นำ", "start": 188.52, "end": 190.2}, {"th": "และชอบเจ้ากี้เจ้าการกับคนอื่นอยู่บ่อย ๆ", "start": 190.56, "end": 194.26}]}, {"zh": "處女座（9 月 17 日至 10 月 16 日）：不喜歡說別人的壞話；非必要時不會負面評論他人，而且記憶力極佳。", "ja": "乙女座（9月17日～10月16日）：人の悪口や陰口を好まず、必要がなければ否定的に語らない。記憶力も抜群である。", "phrases": [{"th": "ราศีกันย์", "date": "17 ก.ย. - 16 ต.ค.", "start": 196.22, "end": 203.14}, {"th": "ชาวราศีกันย์เป็นคนไม่ชอบนินทาว่าร้ายคนอื่น", "start": 203.14, "end": 208.2}, {"th": "ถ้าไม่จำเป็นก็จะไม่พูดถึงใครในแง่ร้าย", "start": 208.7, "end": 213.18}, {"th": "และมีความจำเป็นเลิศ", "start": 213.64, "end": 215.76}]}, {"zh": "天秤座（10 月 17 日至 11 月 15 日）：被稱為最有魅力的星座，因為個性禮貌溫和、有禮儀、待人親切，且很有與人相處的天分。", "ja": "天秤座（10月17日～11月15日）：最も魅力的な星座といわれる。礼儀正しく穏やかで、感じがよく、人と打ち解ける才能があるからだ。", "phrases": [{"th": "ราศีตุลย์", "date": "17 ต.ค. - 15 พ.ย.", "start": 217.9, "end": 224.94}, {"th": "เป็นราศีที่ได้ชื่อว่ามีเสน่ห์มากที่สุด", "start": 224.94, "end": 229.14}, {"th": "เนื่องจากเป็นคนสุภาพอ่อนโยน", "start": 229.64, "end": 232.48}, {"th": "มีมารยาท อัธยาศัยดี", "start": 232.9, "end": 236.12}, {"th": "มีพรสวรรค์ในการเข้ากับคนอื่น", "start": 236.66, "end": 240.92}]}, {"zh": "天蠍座（11 月 16 日至 12 月 15 日）：做事非常投入，但有時投入過頭，讓人覺得以自我為中心。", "ja": "蠍座（11月16日～12月15日）：何事にも非常に打ち込むが、度が過ぎてわがままに見えることがある。", "phrases": [{"th": "ราศีพิจิก", "date": "16 พ.ย. - 15 ธ.ค.", "start": 241.48, "end": 248.96}, {"th": "ชาวราศีพิจิกเป็นคนทำอะไรทุ่มเทมาก", "start": 248.96, "end": 253.42}, {"th": "บางครั้งมากเกินไป", "start": 253.86, "end": 255.66}, {"th": "จนทำให้ดูเป็นคนเอาแต่ใจตัวเอง", "start": 255.98, "end": 259.36}]}, {"zh": "射手座（12 月 16 日至 1 月 13 日）：樂觀、隨和，是真正快樂的人，因為他們知道焦慮沒有用，一切都會沿著自己的軌道發展。", "ja": "射手座（12月16日～1月13日）：楽観的でおおらか。本当に幸せな人であり、心配しても意味はなく、すべてはなるようになると分かっている。", "phrases": [{"th": "ราศีธนู", "date": "16 ธ.ค. - 13 ม.ค.", "start": 260.84, "end": 267.96}, {"th": "ชาวราศีธนู", "start": 267.96, "end": 269.54}, {"th": "เป็นคนมองโลกในแง่ดี สบาย ๆ", "start": 269.86, "end": 273.67}, {"th": "ชาวราศีธนูเป็นคนที่มีความสุขอย่างแท้จริง", "start": 274.34, "end": 278.66}, {"th": "เนื่องจากเขารู้ว่าไม่มีประโยชน์จะต้องมาวิตกกังวล", "start": 279.12, "end": 284.78}, {"th": "เพราะทุกสิ่งจะเป็นไปตามทางของมัน", "start": 285.2, "end": 288.3}]}]</script>
<script>
const DATA = JSON.parse(document.getElementById('practice-data').textContent);
const $ = id => document.getElementById(id);
const audio = $('audio');

// build transcript
const lines = [];
DATA.forEach(para => {
  const box = document.createElement('section');
  box.className = 'card para';
  para.phrases.forEach((ph, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'line'; b.lang = 'th';
    const t = document.createElement('span'); t.className = 't';
    t.textContent = ph.th;
    b.append(t);
    if (ph.date) { const s = document.createElement('span'); s.className = 'date'; s.textContent = '  (' + ph.date + ')'; b.append(s); }
    const k = lines.length;
    b.onclick = () => { stop(); cur = k; runFrom(k, false); };
    box.append(b);
    lines.push({ ...ph, el: b, sign: para.phrases[0].th });
  });
  const zh = document.createElement('p'); zh.className = 'zh'; zh.textContent = para.zh;
  const ja = document.createElement('p'); ja.className = 'ja'; ja.lang = 'ja'; ja.textContent = para.ja;
  box.append(zh, ja);
  $('text').append(box);
});

const REPS = [1, 2, 3], SPEEDS = [1, 0.85, 0.7], TURN_SECONDS = 8;
let reps = 1, speed = 1, cur = 0, token = 0, running = false;

const UI = {
  en: { allLevels: 'All Levels', levelHome: 'Level 4 Home', title: 'Lesson 6 Shadowing · Thai Notes', heading: 'Shadowing',
        idle: 'Tap any sentence, or press Start', start: '▶ Start', pause: '❚❚ Pause',
        reps: n => `Repeat ${n}×`, gap: 'Pause to repeat', hide: 'Hide Thai', listen: 'Listen', round: (r, n) => ` (${r}/${n})`,
        yours: 'Your turn', secs: n => `${n}s`, finished: 'All done', resume: 'Press ▶ to continue from here', paused: 'Paused',
        prev: 'Previous', next: 'Next', playErr: 'Cannot play: ',
        loadErr: c => `Audio failed to load (error ${c}). Check your connection and reload.` },
};
const lang = 'en';
const T = () => UI[lang];
let lastStatus = () => T().idle;
function applyLang() {
  const t = T();
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  $('prev').setAttribute('aria-label', t.prev);
  $('next').setAttribute('aria-label', t.next);
  $('rep').textContent = t.reps(reps);
  $('go').textContent = running ? t.pause : t.start;
  $('status').innerHTML = lastStatus();
}

function setStatus(fn) { lastStatus = fn; $('status').innerHTML = fn(); }
function mark(k, yours) {
  lines.forEach((l, i) => { l.el.classList.toggle('now', i === k); l.el.classList.toggle('yours', i === k && yours); });
  lines[k].el.classList.add('revealed');
  lines[k].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function wait(ms, my) { return new Promise(r => setTimeout(() => r(my === token), ms)); }
function playSeg(l, my) {
  return new Promise(resolve => {
    audio.playbackRate = speed;
    audio.currentTime = Math.max(0, l.start - 0.08);
    const stopAt = l.end + 0.18;
    audio.play().catch(err => setStatus(() => '<b>' + T().playErr + '</b>' + err.name + ' — ' + err.message));
    const tick = () => {
      if (my !== token) return resolve(false);
      if (audio.currentTime >= stopAt || audio.ended) { audio.pause(); return resolve(true); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}
async function runFrom(k, continuous) {
  const my = ++token;
  running = continuous;
  $('go').textContent = continuous ? T().pause : T().start;
  for (let i = k; i < lines.length; i++) {
    cur = i;
    const l = lines[i];
    for (let r = 0; r < reps; r++) {
      mark(i, false);
      setStatus(() => `<b>${i + 1} / ${lines.length}</b> · ${l.sign} · ${T().listen}` + (reps > 1 ? T().round(r + 1, reps) : ''));
      if (!await playSeg(l, my)) return;
      if (continuous && $('gap').getAttribute('aria-pressed') === 'true') {
        mark(i, true);
        for (let left = TURN_SECONDS; left > 0; left--) {
          setStatus(() => `<b>${i + 1} / ${lines.length}</b> · ${l.sign} · <b>${T().yours}</b> <span class="count">${T().secs(left)}</span>`);
          if (!await wait(1000, my)) return;
        }
      }
    }
    if (!continuous) break;
  }
  if (my === token) {
    running = false;
    $('go').textContent = T().start;
    const done = continuous && cur === lines.length - 1, at = cur;
    setStatus(() => done ? T().finished : `<b>${at + 1} / ${lines.length}</b> · ${T().resume}`);
  }
}
audio.addEventListener('error', () => setStatus(() => '<b>' + T().loadErr(audio.error && audio.error.code) + '</b>'));
function stop() { token++; audio.pause(); running = false; $('go').textContent = T().start; }

$('go').onclick = () => { if (!running) return runFrom(cur, true); stop(); const at = cur; setStatus(() => `<b>${at + 1} / ${lines.length}</b> · ${T().paused}`); };
$('prev').onclick = () => { const was = running; stop(); cur = Math.max(0, cur - 1); runFrom(cur, was); };
$('next').onclick = () => { const was = running; stop(); cur = Math.min(lines.length - 1, cur + 1); runFrom(cur, was); };
$('rep').onclick = e => { reps = REPS[(REPS.indexOf(reps) + 1) % REPS.length]; e.currentTarget.textContent = T().reps(reps); };
$('speed').onclick = e => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; e.currentTarget.textContent = `Speed ${speed}×`; };
$('gap').onclick = e => { const b = e.currentTarget; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); };
$('hide').onclick = e => {
  const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
  b.setAttribute('aria-pressed', on);
  document.body.classList.toggle('hide-text', on);
  lines.forEach(l => l.el.classList.remove('revealed'));
};
document.addEventListener('keydown', e => {
  if (e.target.closest('button') && e.key === ' ') { e.preventDefault(); $('go').click(); return; }
  if (e.key === ' ') { e.preventDefault(); $('go').click(); }
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'ArrowLeft') $('prev').click();
});
applyLang();
</script>
</body>
</html>
